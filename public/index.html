<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GLITCH — Real-Time Sabotage Party Game</title>
  <meta name="description" content="Compete in 8-second micro-challenges, earn Glitch Tokens, and sabotage your opponents' screens in real-time. Last player standing wins.">

  <!-- Inline SVG Favicon (Zero external image files) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2307060E'/><text x='50%' y='68%' font-size='60' font-family='sans-serif' font-weight='bold' fill='%2306F9EC' text-anchor='middle'>⚡</text></svg>">

  <!-- Google Fonts: Space Grotesk & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="glitch-theme">
  <!-- Cyberpunk background ambiance -->
  <div class="cyber-bg-glow"></div>
  <div class="cyber-scanlines"></div>

  <!-- Primary Application Mount -->
  <main id="app-screen-container" class="app-container" role="main"></main>

  <!-- Global Toast Notification Layer -->
  <aside id="toast-container" class="toast-container" aria-live="polite"></aside>

  <!-- Socket.io & App Bootstrap -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
